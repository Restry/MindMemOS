services:
  pgvector:
    image: pgvector/pgvector:${PGVECTOR_IMAGE_TAG:-0.8.2-pg17-bookworm}
    container_name: mindmemos-lite-pgvector
    restart: unless-stopped
    profiles:
      - pgvector
    environment:
      POSTGRES_DB: ${MINDMEMOS_LITE_POSTGRES_DB:-mindmemos}
      POSTGRES_USER: ${MINDMEMOS_LITE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${MINDMEMOS_LITE_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${MINDMEMOS_LITE_PGVECTOR_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgvector_data:
